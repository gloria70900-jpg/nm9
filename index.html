<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Harold Halibut — Universal Dome Video Theater</title>
  <style>
    html, body { margin:0; padding:0; background:#000; color:#eee; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; height:100%; overflow:hidden; touch-action:none; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 100; background: rgba(10, 10, 14, 0.92); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 12px 14px; max-width: 450px; max-height: 92vh; overflow-y: auto; line-height: 1.25; }
    #ui h1 { font-size: 14px; margin: 0 0 6px; font-weight: 700; color:#66b3ff; }
    #ui h2 { font-size: 12px; margin: 10px 0 6px; font-weight: 700; color:#ff6b6b; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
    #ui .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
    #ui label { width: 170px; font-size: 11px; color:#ddd; }
    #ui input[type="range"] { flex:1; accent-color: #0088ff; }
    #ui select, #ui button { background:#1b1b22; color:#eee; border-radius:6px; border:1px solid #444; padding:6px 8px; font-size:11px; }
    #ui button { cursor:pointer; }
    #ui button:hover { background:#2a2a35; }

    /* 모든 포맷 지원 비디오 업로드 패널 */
    .dome-card { background: rgba(0, 136, 255, 0.15); border: 1px solid #0088ff; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .dome-card h3 { margin: 0 0 6px; font-size: 12px; color: #66b3ff; }
    #domeFileInput { width: 100%; font-size: 12px; color: #fff; background: #002244; padding: 8px; border: 1px solid #0088ff; border-radius: 6px; box-sizing: border-box; cursor: pointer; }
    #videoStatus { font-size: 11px; color: #88ccff; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }

    /* A/B 듀얼 녹화 제어 패널 */
    .rec-card { background: rgba(255, 59, 48, 0.12); border: 1px solid #ff3b30; border-radius: 8px; padding: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .rec-btn-row { display: flex; gap: 6px; }
    .rec-btn { flex: 1; padding: 10px 6px; font-weight: 700; font-size: 11px; color: #fff; border-radius: 6px; cursor: pointer; }
    #recMonoBtn { background: #992020; border: 1px solid #ff5555; }
    #recSbsBtn { background: #205599; border: 1px solid #5599ff; }
    .recording { animation: recBlink 1.2s infinite alternate; }
    #recMonoBtn.recording { background: #ff2222; }
    #recSbsBtn.recording { background: #0077ff; }
    @keyframes recBlink { 0% { opacity: 1; } 100% { opacity: 0.45; } }
    #recStatus { font-size: 11px; color: #ff9999; text-align: center; margin-top: 2px; }

    /* 모바일 수경 VR 버튼 */
    .mobile-vr-card { background: rgba(0, 200, 100, 0.15); border: 1px solid #00c864; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    #mobileVrBtn { width: 100%; padding: 8px; font-weight: 700; font-size: 11px; background: #008844; color: #fff; border: 1px solid #00ff88; border-radius: 6px; cursor: pointer; }

    /* 양안 배율 비대칭 선택 패널 */
    .aniseikonia-card { background: rgba(150, 0, 255, 0.12); border: 1px solid #aa44ff; border-radius: 8px; padding: 8px; margin: 8px 0; }
    
    #vrDivider { display: none; position: fixed; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,255,255,0.25); z-index: 5; pointer-events: none; }
    #exitVrBtn { display: none; position: fixed; top: 12px; right: 12px; z-index: 200; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #666; border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

<div id="vrDivider"></div>
<button id="exitVrBtn">✕ VR 모드 종료</button>

<div id="ui">
  <h1>Harold Halibut — Universal 돔 극장</h1>

  <!-- 1. 모든 비디오 포맷 지원 (MP4, WebM, MKV, AVI, MOV 등) -->
  <div class="dome-card">
    <h3>🎬 동영상 선택 (MP4 / WebM / MKV / AVI / MOV 무제한)</h3>
    <input type="file" id="domeFileInput" accept="video/*,.mp4,.webm,.mkv,.avi,.mov" />
    <div id="videoStatus">재생할 비디오 파일을 선택해 주세요.</div>
    <div class="row" style="margin-top:8px;">
      <button id="playPauseBtn" style="flex:1;">▶ 재생 / 일시정지</button>
      <button id="restartBtn" style="flex:1;">⏮ 처음부터</button>
    </div>
    <div class="row">
      <label>동영상 볼륨</label>
      <input id="domeVol" type="range" min="0" max="1" step="0.01" value="0.9" />
    </div>
  </div>

  <!-- 2. 단일(A) / 분할(B) 녹화 선택 모듈 -->
  <div class="rec-card">
    <div class="rec-btn-row">
      <button id="recMonoBtn" class="rec-btn">🔴 단일 녹화 (A 버튼 / Key A)</button>
      <button id="recSbsBtn" class="rec-btn">🔵 양안분할 녹화 (B 버튼 / Key B)</button>
    </div>
    <div id="recStatus">녹화 대기 중 (A: 단일화면 / B: 양안분할화면)</div>
  </div>

  <div class="mobile-vr-card">
    <button id="mobileVrBtn">🥽 스마트폰 수경 VR 화면 모드 켜기</button>
  </div>

  <!-- 3. 양안 배율 비대칭(Aniseikonia) 교정 모드 -->
  <div class="aniseikonia-card">
    <div class="row" style="margin-top:0;">
      <label style="color:#cc88ff; font-weight:700;">비대칭 시야 검사/교정</label>
      <select id="asymmPreset" style="flex:1;">
        <option value="normal">동일 크기 (표준 정상)</option>
        <option value="leftBig" selected>왼쪽이 더 크게 보이는 사람</option>
        <option value="rightBig">오른쪽이 더 크게 보이는 사람</option>
      </select>
    </div>
    <div class="row">
      <label>좌/우안 배율 비 (L vs R)</label>
      <input id="ratioSlider" type="range" min="0.7" max="1.3" step="0.01" value="0.85" />
      <span id="ratioText" style="font-size:11px; color:#cc88ff; width:34px; text-align:right;">0.85</span>
    </div>
  </div>

  <h2>파노라마 돔 환경 파라미터</h2>
  <div class="row"><label>돔 곡면 반경 (m)</label><input id="domeRadius" type="range" min="10" max="60" step="1" value="30" /></div>
  <div class="row"><label>돔 수평 시야각 (도)</label><input id="domeFovX" type="range" min="90" max="240" step="5" value="180" /></div>
  <div class="row"><label>돔 중심 높이 (m)</label><input id="domeHeight" type="range" min="-5" max="10" step="0.5" value="1.6" /></div>
</div>

<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
  import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/webxr/VRButton.js';

  const $ = (sel) => document.querySelector(sel);

  // ---------- 1. Main Display WebGL Renderer & Scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));
  renderer.xr.setFramebufferScaleFactor(1.25);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020306);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 1.6, 0.0);

  // 모바일 수경 카메라
  const camLeft = new THREE.PerspectiveCamera(75, (window.innerWidth * 0.5) / window.innerHeight, 0.1, 500);
  const camRight = new THREE.PerspectiveCamera(75, (window.innerWidth * 0.5) / window.innerHeight, 0.1, 500);
  const IPD = 0.064;

  // ---------- 2. SBS 독립 오프스크린 렌더러 ----------
  const sbsCanvas = document.createElement('canvas');
  sbsCanvas.width = 1920; sbsCanvas.height = 1080;
  const sbsRenderer = new THREE.WebGLRenderer({ canvas: sbsCanvas, antialias: true, preserveDrawingBuffer: true });
  sbsRenderer.setSize(1920, 1080);
  sbsRenderer.autoClear = false;

  const sbsCamLeft = new THREE.PerspectiveCamera(75, 960 / 1080, 0.1, 500);
  const sbsCamRight = new THREE.PerspectiveCamera(75, 960 / 1080, 0.1, 500);

  // ---------- 3. Web Audio & 하드웨어 비디오 엔진 ----------
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContextClass();
  window.addEventListener('pointerdown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

  const audioStreamDest = audioCtx.createMediaStreamDestination();
  const masterRecordGain = audioCtx.createGain();
  masterRecordGain.gain.value = 1.0;
  masterRecordGain.connect(audioCtx.destination);
  masterRecordGain.connect(audioStreamDest);

  const domeVideoEl = document.createElement('video');
  domeVideoEl.crossOrigin = 'anonymous';
  domeVideoEl.playsInline = true;
  domeVideoEl.loop = true;
  domeVideoEl.muted = false;
  domeVideoEl.preload = 'auto';

  let domeVideoTex = null;
  let videoSourceNode = null;
  const domeVideoGain = audioCtx.createGain();
  domeVideoGain.gain.value = 0.9;
  domeVideoGain.connect(masterRecordGain);

  // ---------- 4. 대형 곡면 돔(Curved Ultra-Wide Dome) 메쉬 구축 ----------
  const domeGroup = new THREE.Group();
  scene.add(domeGroup);

  let domeParams = {
    radius: 30.0,
    fovX: 180.0,
    height: 1.6,
    leftEyeScaleMult: 0.85,
    rightEyeScaleMult: 1.15,
  };

  // 대기 화면 캔버스 텍스처 (100% 렌더링 확인용 안내판)
  const waitCanvas = document.createElement('canvas');
  waitCanvas.width = 1920; waitCanvas.height = 1080;
  const wCtx = waitCanvas.getContext('2d');
  function drawWaitingScreen(msg='동영상 파일을 선택해 주세요') {
    wCtx.fillStyle = '#06101e'; wCtx.fillRect(0,0,1920,1080);
    wCtx.strokeStyle = '#1e3f66'; wCtx.lineWidth = 3;
    for(let x=0; x<=1920; x+=80){ wCtx.beginPath(); wCtx.moveTo(x,0); wCtx.lineTo(x,1080); wCtx.stroke(); }
    for(let y=0; y<=1080; y+=80){ wCtx.beginPath(); wCtx.moveTo(0,y); wCtx.lineTo(1920,y); wCtx.stroke(); }
    wCtx.fillStyle = '#ffffff'; wCtx.font = 'bold 42px sans-serif'; wCtx.textAlign = 'center';
    wCtx.fillText('🎬 Harold Halibut — Panoramic Dome Screen', 960, 480);
    wCtx.fillStyle = '#4da6ff'; wCtx.font = '30px sans-serif';
    wCtx.fillText(msg, 960, 560);
    wCtx.fillStyle = '#aaaaaa'; wCtx.font = '22px sans-serif';
    wCtx.fillText('MP4 / WebM / MKV / AVI / MOV 등 모든 비디오 지원 (무제한 용량)', 960, 620);
  }
  drawWaitingScreen();
  const defaultTex = new THREE.CanvasTexture(waitCanvas);

  // 100% 가시성이 보장되는 양면(DoubleSide) 표준 재질
  const domeMat = new THREE.MeshBasicMaterial({
    map: defaultTex,
    side: THREE.DoubleSide
  });

  let domeMesh = null;
  function buildDomeMesh() {
    if (domeMesh) { domeGroup.remove(domeMesh); domeMesh.geometry.dispose(); }
    const r = domeParams.radius;
    const fovRad = THREE.MathUtils.degToRad(domeParams.fovX);
    // 사용자 정면(-Z 축)을 중심으로 원통 곡면 배치
    const startAngle = -Math.PI * 0.5 - fovRad * 0.5;
    const heightSpan = (r * fovRad) * (9 / 16); // 16:9 화면비 유지

    // CylinderGeometry(radiusTop, radiusBottom, height, radialSegments, heightSegments, openEnded, thetaStart, thetaLength)
    const geo = new THREE.CylinderGeometry(r, r, heightSpan, 64, 16, true, startAngle, fovRad);
    
    // UV 텍스처 좌표가 정면에서 올바르게 보이도록 매핑 보정
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) {
      uv.setX(i, 1.0 - uv.getX(i)); // 좌우 반전 교정
    }
    uv.needsUpdate = true;

    domeMesh = new THREE.Mesh(geo, domeMat);
    domeMesh.position.set(0, domeParams.height, 0);
    domeGroup.add(domeMesh);
  }
  buildDomeMesh();

  // ---------- 5. 비디오 로드 및 자동 재생 파이프라인 ----------
  const domeFileInput = $('#domeFileInput');
  const videoStatus = $('#videoStatus');
  const playPauseBtn = $('#playPauseBtn');
  const restartBtn = $('#restartBtn');
  const domeVol = $('#domeVol');

  domeFileInput.addEventListener('change', () => {
    const file = domeFileInput.files && domeFileInput.files[0];
    if (!file) return;

    if (audioCtx.state === 'suspended') audioCtx.resume();
    videoStatus.textContent = `⏳ 파일 스트림 분석 중: ${file.name}...`;

    // RAM 점유 없이 직접 스트리밍하는 Blob URL 생성
    const streamUrl = URL.createObjectURL(file);
    domeVideoEl.src = streamUrl;
    domeVideoEl.load();

    // 새 비디오 텍스처 초기화
    if (domeVideoTex) domeVideoTex.dispose();
    domeVideoTex = new THREE.VideoTexture(domeVideoEl);
    domeVideoTex.colorSpace = THREE.SRGBColorSpace;
    domeVideoTex.minFilter = THREE.LinearFilter;
    domeVideoTex.magFilter = THREE.LinearFilter;
    domeVideoTex.generateMipmaps = false;

    domeMat.map = domeVideoTex;
    domeMat.needsUpdate = true;

    // Web Audio 라우팅
    if (!videoSourceNode) {
      try {
        videoSourceNode = audioCtx.createMediaElementSource(domeVideoEl);
        videoSourceNode.connect(domeVideoGain);
      } catch(err) {
        console.warn('MediaElementSource 재연결 생략:', err);
      }
    }

    // 메타데이터 로드 완료 후 재생 시작
    domeVideoEl.onloadeddata = () => {
      domeVideoEl.play().then(() => {
        videoStatus.textContent = `▶ 재생 중: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`;
      }).catch(err => {
        videoStatus.textContent = `준비 완료: [▶ 재생] 버튼을 클릭해 주세요.`;
      });
    };

    domeVideoEl.onerror = () => {
      videoStatus.textContent = `❌ 재생 오류: 브라우저가 지원하지 않는 코덱입니다.`;
    };
  });

  playPauseBtn.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!domeVideoEl.src) return;
    if (domeVideoEl.paused) {
      domeVideoEl.play().then(() => {
        videoStatus.textContent = `▶ 재생 중`;
      }).catch(e => {
        videoStatus.textContent = `재생 실패: 화면을 터치해 주세요.`;
      });
    } else {
      domeVideoEl.pause();
      videoStatus.textContent = `⏸ 일시 정지됨`;
    }
  });

  restartBtn.addEventListener('click', () => {
    if (!domeVideoEl.src) return;
    domeVideoEl.currentTime = 0;
    domeVideoEl.play();
  });

  domeVol.addEventListener('input', e => {
    domeVideoGain.gain.value = Number(e.target.value);
  });

  // ---------- 6. 양안 배율 비대칭 파라미터 제어 ----------
  const asymmPreset = $('#asymmPreset');
  const ratioSlider = $('#ratioSlider');
  const ratioText = $('#ratioText');
  const domeRadiusEl = $('#domeRadius');
  const domeFovXEl = $('#domeFovX');
  const domeHeightEl = $('#domeHeight');

  function updateAsymmetry(val) {
    ratioSlider.value = val.toFixed(2);
    ratioText.textContent = val.toFixed(2);
    if (Math.abs(val - 1.0) < 0.001) {
      domeParams.leftEyeScaleMult = 1.0;
      domeParams.rightEyeScaleMult = 1.0;
    } else if (val < 1.0) {
      const diff = 1.0 - val;
      domeParams.leftEyeScaleMult = 1.0 - diff;
      domeParams.rightEyeScaleMult = 1.0 + diff;
    } else {
      const diff = val - 1.0;
      domeParams.leftEyeScaleMult = 1.0 + diff;
      domeParams.rightEyeScaleMult = 1.0 - diff;
    }
  }

  asymmPreset.addEventListener('change', () => {
    if (asymmPreset.value === 'leftBig') updateAsymmetry(0.85);
    else if (asymmPreset.value === 'rightBig') updateAsymmetry(1.15);
    else updateAsymmetry(1.00);
  });

  ratioSlider.addEventListener('input', (e) => {
    updateAsymmetry(Number(e.target.value));
  });

  domeRadiusEl.addEventListener('input', e => { domeParams.radius = Number(e.target.value); buildDomeMesh(); });
  domeFovXEl.addEventListener('input', e => { domeParams.fovX = Number(e.target.value); buildDomeMesh(); });
  domeHeightEl.addEventListener('input', e => { domeParams.height = Number(e.target.value); if(domeMesh) domeMesh.position.y = domeParams.height; });

  // ---------- 7. 스마트폰 수경 VR 모드 (Cardboard SBS) ----------
  const uiPanel = $('#ui');
  const vrDivider = $('#vrDivider');
  const exitVrBtn = $('#exitVrBtn');
  const mobileVrBtn = $('#mobileVrBtn');
  let isMobileVr = false;
  let deviceEuler = new THREE.Euler(0, 0, 0, 'YXZ');

  function startMobileVR(){
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
      }).catch(console.error);
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }

    const docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();

    isMobileVr = true;
    uiPanel.style.display = 'none';
    vrDivider.style.display = 'block';
    exitVrBtn.style.display = 'block';
    onResize();
  }

  function stopMobileVR(){
    isMobileVr = false;
    uiPanel.style.display = 'block';
    vrDivider.style.display = 'none';
    exitVrBtn.style.display = 'none';
    window.removeEventListener('deviceorientation', handleOrientation);
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    onResize();
  }

  mobileVrBtn.addEventListener('click', startMobileVR);
  exitVrBtn.addEventListener('click', stopMobileVR);

  function handleOrientation(e){
    if (!e.alpha) return;
    const alpha = THREE.MathUtils.degToRad(e.alpha);
    const beta = THREE.MathUtils.degToRad(e.beta);
    const gamma = THREE.MathUtils.degToRad(e.gamma);
    deviceEuler.set(beta, alpha, -gamma, 'YXZ');
    camera.quaternion.setFromEuler(deviceEuler);
  }

  function onResize(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    camLeft.aspect = (w * 0.5) / h;
    camLeft.updateProjectionMatrix();
    camRight.aspect = (w * 0.5) / h;
    camRight.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);

  // ---------- 8. A(단일) / B(양안 SBS) 듀얼 녹화 모듈 ----------
  const recMonoBtn = $('#recMonoBtn');
  const recSbsBtn  = $('#recSbsBtn');
  const recStatus  = $('#recStatus');

  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let recordingMode = null;
  let recordStartTime = 0;

  function getBestSupportedMimeType(){
    const candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
    for(const t of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    }
    return '';
  }

  function startRecording(mode){
    if (isRecording) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    try {
      recordingMode = mode;
      const streamSource = (mode === 'sbs') ? sbsCanvas.captureStream(30) : renderer.domElement.captureStream(30);

      const audioTracks = audioStreamDest.stream.getAudioTracks();
      const tracks = [...streamSource.getVideoTracks()];
      if (audioTracks.length > 0) tracks.push(audioTracks[0]);
      const combinedStream = new MediaStream(tracks);

      const mime = getBestSupportedMimeType();
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(combinedStream, mime ? { mimeType: mime, videoBitsPerSecond: 10000000 } : {});

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const isMp4 = mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
        const prefix = (recordingMode === 'sbs') ? 'Harold_Dome_SBS' : 'Harold_Dome_Mono';
        a.download = `${prefix}_${dateStr}.${ext}`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);

        recStatus.textContent = `저장 완료: ${prefix}_${dateStr}.${ext}`;
        recMonoBtn.classList.remove('recording');
        recSbsBtn.classList.remove('recording');
        recMonoBtn.textContent = '🔴 단일 녹화 (A 버튼 / Key A)';
        recSbsBtn.textContent = '🔵 양안분할 녹화 (B 버튼 / Key B)';
        isRecording = false;
        recordingMode = null;
      };

      mediaRecorder.start(1000);
      isRecording = true;
      recordStartTime = performance.now();

      if (mode === 'sbs') {
        recSbsBtn.classList.add('recording');
        recSbsBtn.textContent = '⏹️ 양안분할 녹화 중지 (B 버튼)';
        recStatus.textContent = '● [양안분할 SBS] 녹화 진행 중...';
      } else {
        recMonoBtn.classList.add('recording');
        recMonoBtn.textContent = '⏹️ 단일 녹화 중지 (A 버튼)';
        recStatus.textContent = '● [단일 모노] 녹화 진행 중...';
      }

    } catch (err) {
      recStatus.textContent = '녹화 실패: ' + err.message;
      isRecording = false;
    }
  }

  function stopRecording(){
    if (!isRecording || !mediaRecorder) return;
    if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    recStatus.textContent = '인코딩 및 MP4 파일 저장 중...';
  }

  function toggleRecordMono(){
    if (isRecording) {
      if (recordingMode === 'mono') stopRecording();
      else { stopRecording(); setTimeout(()=>startRecording('mono'), 400); }
    } else {
      startRecording('mono');
    }
  }

  function toggleRecordSbs(){
    if (isRecording) {
      if (recordingMode === 'sbs') stopRecording();
      else { stopRecording(); setTimeout(()=>startRecording('sbs'), 400); }
    } else {
      startRecording('sbs');
    }
  }

  recMonoBtn.addEventListener('click', toggleRecordMono);
  recSbsBtn.addEventListener('click', toggleRecordSbs);

  window.addEventListener('keydown', (e)=>{
    if (e.code === 'KeyA') toggleRecordMono();
    if (e.code === 'KeyB') toggleRecordSbs();
  });

  // 오큘러스 컨트롤러 A/B 버튼 감지
  let lastButtonStates = { btnA: false, btnB: false };
  function handleQuestDualButtons(){
    const session = renderer.xr.getSession();
    if (!session || !session.inputSources) return;

    for (const source of session.inputSources) {
      if (source && source.handedness === 'right' && source.gamepad && source.gamepad.buttons) {
        const bA = source.gamepad.buttons[4];
        const bB = source.gamepad.buttons[5];

        if (bA) {
          const pressedA = bA.pressed || bA.value > 0.5;
          if (pressedA && !lastButtonStates.btnA) toggleRecordMono();
          lastButtonStates.btnA = pressedA;
        }
        if (bB) {
          const pressedB = bB.pressed || bB.value > 0.5;
          if (pressedB && !lastButtonStates.btnB) toggleRecordSbs();
          lastButtonStates.btnB = pressedB;
        }
      }
    }
  }

  // ---------- 9. Main Animation Loop ----------
  renderer.setAnimationLoop(() => {
    // 비디오 텍스처 프레임 동기화 갱신
    if (domeVideoTex && domeVideoEl.readyState >= domeVideoEl.HAVE_CURRENT_DATA) {
      domeVideoTex.needsUpdate = true;
    }

    // 1. SBS 분할 녹화 중일 때 (백그라운드 sbsRenderer가 전용 캔버스에 분할 렌더)
    if (isRecording && recordingMode === 'sbs') {
      sbsCamLeft.position.copy(camera.position);
      sbsCamRight.position.copy(camera.position);
      sbsCamLeft.quaternion.copy(camera.quaternion);
      sbsCamRight.quaternion.copy(camera.quaternion);
      sbsCamLeft.translateX(-IPD * 0.5);
      sbsCamRight.translateX(IPD * 0.5);

      sbsRenderer.clear();

      // [좌안 0.85x]
      domeGroup.scale.set(domeParams.leftEyeScaleMult, domeParams.leftEyeScaleMult, domeParams.leftEyeScaleMult);
      domeGroup.updateMatrixWorld(true);
      sbsRenderer.setViewport(0, 0, 960, 1080);
      sbsRenderer.setScissor(0, 0, 960, 1080);
      sbsRenderer.setScissorTest(true);
      sbsRenderer.render(scene, sbsCamLeft);

      // [우안 1.15x]
      domeGroup.scale.set(domeParams.rightEyeScaleMult, domeParams.rightEyeScaleMult, domeParams.rightEyeScaleMult);
      domeGroup.updateMatrixWorld(true);
      sbsRenderer.setViewport(960, 0, 960, 1080);
      sbsRenderer.setScissor(960, 0, 960, 1080);
      sbsRenderer.setScissorTest(true);
      sbsRenderer.render(scene, sbsCamRight);

      sbsRenderer.setScissorTest(false);
    }

    // 2. 화면 출력 렌더링
    if (renderer.xr.isPresenting) {
      handleQuestDualButtons();
      domeGroup.scale.set(1, 1, 1);
      renderer.render(scene, camera);
    } else if (isMobileVr) {
      // 모바일 수경 VR 직접 분할 렌더
      const w = window.innerWidth;
      const h = window.innerHeight;
      const halfW = Math.floor(w * 0.5);

      renderer.autoClear = false;
      renderer.clear();

      camLeft.position.copy(camera.position);
      camRight.position.copy(camera.position);
      camLeft.quaternion.copy(camera.quaternion);
      camRight.quaternion.copy(camera.quaternion);
      camLeft.translateX(-IPD * 0.5);
      camRight.translateX(IPD * 0.5);

      // 좌안 (0.85x)
      domeGroup.scale.set(domeParams.leftEyeScaleMult, domeParams.leftEyeScaleMult, domeParams.leftEyeScaleMult);
      domeGroup.updateMatrixWorld(true);
      renderer.setViewport(0, 0, halfW, h);
      renderer.setScissor(0, 0, halfW, h);
      renderer.setScissorTest(true);
      renderer.render(scene, camLeft);

      // 우안 (1.15x)
      domeGroup.scale.set(domeParams.rightEyeScaleMult, domeParams.rightEyeScaleMult, domeParams.rightEyeScaleMult);
      domeGroup.updateMatrixWorld(true);
      renderer.setViewport(halfW, 0, halfW, h);
      renderer.setScissor(halfW, 0, halfW, h);
      renderer.setScissorTest(true);
      renderer.render(scene, camRight);

      renderer.setScissorTest(false);
    } else {
      // 일반 PC 2D 브라우저 화면
      renderer.autoClear = true;
      domeGroup.scale.set(1, 1, 1);
      renderer.render(scene, camera);
    }
  });
</script>
</body>
